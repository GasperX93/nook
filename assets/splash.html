<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <title>Nook</title>
  <style>
    @font-face {
      font-family: 'iA-Writer';
      src: url('iAWriterQuattroS-Regular.woff');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      width: 800px;
      height: 600px;
      overflow: hidden;
      background: rgb(15, 17, 23);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'iA-Writer', serif;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgb(247, 104, 8);
      margin-bottom: 20px;
      box-shadow: 0 0 12px rgba(247, 104, 8, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .wordmark {
      height: 34px;
      width: auto;
      fill: rgb(240, 244, 248);
      overflow: visible;
    }


    .tagline {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      color: rgb(120, 130, 150);
    }

    .status {
      position: absolute;
      bottom: 44px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgb(60, 68, 86);
    }
  </style>
</head>
<body>
  <div class='dot'></div>
  <svg class='wordmark' viewBox='0 3.127 921 182.411' role='img' aria-label='Nook'><path d='M921 3.12698L877.742 94.3325L921 185.538H858.98L827.189 117.785H803.215V185.538H745.625V3.12698L803.215 3.12698V67.7526H828.752L858.98 3.12698L921 3.12698Z'/><path d='M624.832 0C683.204 0 724.898 38.0457 724.898 94.3325C724.898 150.88 683.204 188.665 624.832 188.665H520.597C463.529 188.665 420.532 150.88 420.532 94.3325C420.532 38.0457 462.226 0 520.597 0L624.832 0ZM624.832 135.245C649.588 135.245 666.526 117.525 666.526 94.3325C666.526 71.4009 649.588 53.4203 624.832 53.4203L520.597 53.4203C495.842 53.4203 478.903 71.4009 478.903 94.3325C478.903 117.525 495.842 135.245 520.597 135.245H624.832Z'/><path d='M304.817 0C363.189 0 404.883 38.0457 404.883 94.3325C404.883 150.88 363.189 188.665 304.817 188.665H304.035C246.967 188.665 203.97 150.88 203.97 94.3325C203.97 38.0457 245.664 0 304.035 0L304.817 0ZM304.817 135.245C329.573 135.245 346.511 118.307 346.511 94.3325C346.511 70.6191 329.573 53.4203 304.817 53.4203H304.035C279.28 53.4203 262.341 70.6191 262.341 94.3325C262.341 118.307 279.28 135.245 304.035 135.245H304.817Z'/><path d='M126.906 3.12698L183.193 3.12698V185.538H126.906L56.2868 89.6419V185.538H0L0 3.12698L56.2868 3.12698L126.906 96.6778V3.12698Z'/></svg>
  <div class='tagline'>Drive on top of Swarm Decentralised Storage</div>

  <div class='status'><span id='message'>Starting</span><span id='dots'></span></div>
</body>
<script>
  const urlParams = new URLSearchParams(window.location.search)

  if (urlParams.has('msg')) {
    document.getElementById('message').innerText = decodeURI(urlParams.get('msg'))
  }

  const dotsElem = document.getElementById('dots')
  setInterval(() => {
    dotsElem.innerText = dotsElem.innerText.length >= 3 ? '' : dotsElem.innerText + '.'
  }, 500)
</script>
</html>
