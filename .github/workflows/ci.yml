name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  lint-types-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - run: npm ci
      # .npmrc blocks install scripts; this runs the few Nook needs (see devkit.mjs)
      - run: npm run install:scripts
      - run: cd ui && npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run check:types

      - name: Backend tests
        run: npm run test:unit

      - name: Frontend tests
        run: cd ui && npm test
